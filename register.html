<!doctype html><html lang=ru><head><meta charset=UTF-8 /><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><title>PinShare — вход</title><script src=https://telegram.org/js/telegram-web-app.js></script><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel=stylesheet><style>
:root{
  --accent-400:#8fb0ff;--accent-500:#5c86fb;--accent-600:#2f5adf;
  --bg-deep-1:#3d6bf6;--bg-deep-2:#1c3a92;--bg-deep-3:#12245e;
  --radius-xl:26px;--radius-lg:20px;--radius-pill:999px;
  --font-display:"Unbounded","Inter",sans-serif;
  --font-body:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
body{
  font-family:var(--font-body);color:#fff;min-height:100vh;
  background:
    radial-gradient(120% 55% at 18% 0%, rgba(255,255,255,.16), transparent 60%),
    radial-gradient(90% 60% at 100% 100%, rgba(18,36,94,.55), transparent 55%),
    linear-gradient(165deg, var(--bg-deep-1) 0%, var(--bg-deep-2) 55%, var(--bg-deep-3) 120%);
  overflow:hidden;position:relative
}
button{font-family:inherit;border:none;background:0 0;cursor:pointer;color:inherit}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;pointer-events:none}
.orb--1{width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);top:-90px;right:-70px}
.orb--2{width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);bottom:6%;left:-60px}

#app{
  position:relative;z-index:1;min-height:100vh;max-width:520px;margin:0 auto;
  padding:calc(var(--safe-top) + 32px) 26px calc(var(--safe-bottom) + 28px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:0
}
.wordmark{
  font-family:var(--font-display);font-weight:800;font-size:34px;
  letter-spacing:-.02em;margin:0;color:#fff
}
.tagline{
  margin:10px 0 0;font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.78);
  max-width:300px;font-weight:500
}
.auth-actions{width:100%;max-width:340px;margin-top:40px;display:flex;flex-direction:column;gap:12px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;height:54px;border-radius:var(--radius-pill);
  font-weight:700;font-size:15.5px;letter-spacing:.01em;
  transition:transform .14s ease,opacity .14s ease
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn-primary{
  background:#fff;color:var(--accent-600);
  box-shadow:0 16px 30px rgba(10,20,60,.35)
}
.btn-secondary{
  background:rgba(255,255,255,.14);color:#fff;
  border:1.5px solid rgba(255,255,255,.5)
}
.btn svg{width:19px;height:19px;flex-shrink:0}
.spinner{
  width:19px;height:19px;border-radius:50%;
  border:2.5px solid rgba(47,90,223,.25);border-top-color:var(--accent-600);
  animation:spin .7s linear infinite
}
.btn-secondary .spinner{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{
  margin-top:22px;display:flex;align-items:center;gap:7px;
  font-size:12.5px;color:rgba(255,255,255,.65);font-weight:500
}
.hint svg{width:15px;height:15px;flex-shrink:0}
.footnote{
  position:absolute;left:0;right:0;bottom:calc(var(--safe-bottom) + 18px);
  text-align:center;font-size:11.5px;color:rgba(255,255,255,.45);font-weight:500;z-index:1
}

.toast-container{
  position:fixed;top:calc(var(--safe-top) + 20px);left:50%;transform:translateX(-50%);
  z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;
  width:100%;max-width:440px;padding:0 22px;pointer-events:none
}
.toast{
  background:rgba(15,20,45,.92);color:#fff;font-size:13.5px;font-weight:600;
  padding:11px 18px;border-radius:var(--radius-pill);box-shadow:0 10px 26px rgba(0,0,0,.28);
  opacity:0;transform:translateY(-10px);transition:all .25s ease;max-width:100%;text-align:center
}
.toast--visible{opacity:1;transform:translateY(0)}
.toast--error{background:#ef4d4d}

@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}
</style></head>
<body>
<div class="orb orb--1"></div><div class="orb orb--2"></div>
<div id=app>
  <h1 class=wordmark>PinShare</h1>
  <p class=tagline>Выполняй задания за пины и зарабатывай монеты</p>

  <div class=auth-actions>
    <button id=btn-register class="btn btn-primary">
      <svg viewBox="0 0 240 240" aria-hidden=true><circle cx=120 cy=120 r=120 fill="#2f5adf"/><path fill="#fff" d="M177 68l-19.7 96.5c-1.5 6.7-5.4 8.3-10.9 5.2l-30.2-22.3-14.6 14c-1.6 1.6-3 3-6 3l2.2-30.6 55.7-50.3c2.4-2.2-.5-3.4-3.7-1.2l-68.9 43.4-29.7-9.3c-6.4-2-6.6-6.4 1.4-9.5l116-44.7c5.4-2 10.1 1.3 8.4 9.5z"/></svg>
      <span id=register-label>Зарегистрироваться</span>
    </button>
    <button id=btn-login class="btn btn-secondary">
      <svg viewBox="0 0 240 240" aria-hidden=true><circle cx=120 cy=120 r=120 fill="#fff" fill-opacity=".16"/><path fill="#fff" d="M177 68l-19.7 96.5c-1.5 6.7-5.4 8.3-10.9 5.2l-30.2-22.3-14.6 14c-1.6 1.6-3 3-6 3l2.2-30.6 55.7-50.3c2.4-2.2-.5-3.4-3.7-1.2l-68.9 43.4-29.7-9.3c-6.4-2-6.6-6.4 1.4-9.5l116-44.7c5.4-2 10.1 1.3 8.4 9.5z"/></svg>
      <span id=login-label>Войти</span>
    </button>
  </div>

  <p class=hint id=hint-text>
    <svg viewBox="0 0 24 24" fill=none aria-hidden=true><path d="M4 12a8 8 0 0 1 13.6-5.7M20 12a8 8 0 0 1-13.6 5.7" stroke="rgba(255,255,255,.75)" stroke-width=2 stroke-linecap=round/><path d="M17 3v4h-4M7 21v-4h4" stroke="rgba(255,255,255,.75)" stroke-width=2 stroke-linecap=round stroke-linejoin=round/></svg>
    <span id=hint-label>Вход и регистрация — через ваш аккаунт Telegram</span>
  </p>
</div>
<p class=footnote>Нажимая «Зарегистрироваться», вы принимаете правила PinShare</p>
<div id=toast-container class=toast-container></div>

<script>
"use strict";
const T=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;

function initTelegram(){
  if(T){
    T.ready();T.expand();
    try{T.setHeaderColor&&T.setHeaderColor("#2f5adf"),T.setBackgroundColor&&T.setBackgroundColor("#1c3a92")}catch(e){}
  }
}
function haptic(kind){
  const h=T&&T.HapticFeedback;
  if(!h)return;
  ["light","medium","heavy","rigid","soft"].includes(kind)?h.impactOccurred(kind):h.notificationOccurred(kind);
}

let toastHost=null;
function toast(msg,type){
  toastHost||(toastHost=document.getElementById("toast-container"));
  const el=document.createElement("div");
  el.className="toast"+(type?" toast--"+type:"");
  el.textContent=msg;
  toastHost.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("toast--visible"));
  setTimeout(()=>{el.classList.remove("toast--visible");setTimeout(()=>el.remove(),300)},2800);
}

function setBusy(btn,busyText){
  const label=btn.querySelector("span");
  btn.dataset.originalHtml=btn.innerHTML;
  btn.disabled=true;
  const icon=btn.querySelector("svg");
  if(icon)icon.outerHTML='<span class="spinner"></span>';
  label.textContent=busyText;
}
function clearBusy(btn){
  if(btn.dataset.originalHtml){btn.innerHTML=btn.dataset.originalHtml;delete btn.dataset.originalHtml}
  btn.disabled=false;
}
function setHint(text){
  document.getElementById("hint-label").textContent=text;
}

function goToApp(){
  window.location.href="index.html";
}

// pinshare_tg_user — только для отображения (имя/аватар до первого /api/me).
// pinshare_session_token — ГЛАВНОЕ: это токен, который прикладывается ко
// всем запросам как Authorization: Bearer <token>. Именно его отсутствие
// на другом устройстве/аккаунте означало "не вижу чужие/свои задания".
const CONNECTED_USER_KEY="pinshare_tg_user";
const SESSION_TOKEN_KEY="pinshare_session_token";
const POLL_INTERVAL_MS=1500;
const POLL_TIMEOUT_MS=3*60*1000;

let pollTimer=null;
function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null}
}

async function startConnectFlow(mode){
  const btnRegister=document.getElementById("btn-register");
  const btnLogin=document.getElementById("btn-login");
  const activeBtn=mode==="register"?btnRegister:btnLogin;
  const otherBtn=mode==="register"?btnLogin:btnRegister;

  setBusy(activeBtn,"Открываем Telegram…");
  otherBtn.disabled=true;

  let data;
  try{
    const res=await fetch("/api/connect/start",{method:"POST"});
    if(!res.ok)throw new Error("bad status");
    data=await res.json();
  }catch(err){
    clearBusy(activeBtn);
    otherBtn.disabled=false;
    toast("Не удалось связаться с сервером PinShare. Попробуйте ещё раз","error");
    return;
  }

  const{token,botLink}=data;
  window.open(botLink,"_blank")||(window.location.href=botLink);
  setHint("Ждём подтверждения в Telegram — нажмите Start в чате с ботом");

  const startedAt=Date.now();
  stopPolling();
  pollTimer=setInterval(async()=>{
    if(Date.now()-startedAt>POLL_TIMEOUT_MS){
      stopPolling();
      clearBusy(activeBtn);
      otherBtn.disabled=false;
      setHint("Вход и регистрация — через ваш аккаунт Telegram");
      toast("Время ожидания истекло. Попробуйте ещё раз","error");
      return;
    }
    try{
      const res=await fetch("/api/connect/status?token="+encodeURIComponent(token));
      if(!res.ok)return;
      const status=await res.json();
      if(status.status==="connected"){
        stopPolling();
        localStorage.setItem(SESSION_TOKEN_KEY,token);
        localStorage.setItem(CONNECTED_USER_KEY,JSON.stringify({
          tgId:status.tgId,
          username:status.username,
          firstName:status.firstName,
          avatarUrl:status.avatarUrl
        }));
        haptic("success");
        clearBusy(activeBtn);
        toast("Аккаунт подключён, "+(status.firstName||status.username||"друг")+"!","success");
        setTimeout(goToApp,500);
      }else if(status.status==="expired"){
        stopPolling();
        clearBusy(activeBtn);
        otherBtn.disabled=false;
        setHint("Вход и регистрация — через ваш аккаунт Telegram");
        toast("Ссылка устарела. Нажмите кнопку ещё раз","error");
      }
    }catch(err){/* сеть моргнула — пробуем на следующем тике */}
  },POLL_INTERVAL_MS);
}

document.getElementById("btn-register").addEventListener("click",()=>startConnectFlow("register"));
document.getElementById("btn-login").addEventListener("click",()=>startConnectFlow("login"));

initTelegram();
</script>
</body></html>
